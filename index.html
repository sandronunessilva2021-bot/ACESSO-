<script>

function notificationJSBox(title, text, icon) {

    Swal.fire({
        title: title,
        text: text,
        icon: icon,
        confirmButtonColor: '#cc8800',
    });

    let search = window.location.search.split('result=');

    history.pushState(
        {},
        null,
        window.location.pathname + search[0]
    );
}


$(document).ready(function () {

    const isIos = () => {

        const userAgent =
            window.navigator.userAgent.toLowerCase();

        return /iphone|ipad|ipod/.test(userAgent);
    };


    const isInStandaloneMode = () =>
        ('standalone' in window.navigator) &&
        (window.navigator.standalone);


    if (isIos() && !isInStandaloneMode()) {
        this.setState({
            showInstallMessage: true
        });
    }


    if ('serviceWorker' in navigator) {

        navigator.serviceWorker.register("service-worker.js")
            .then(registration => {

            })
            .catch(err => {

            });

    }


    $("#show_hide_password a").on('click', function (event) {

        event.preventDefault();

        const input = $('#show_hide_password input');
        const icon = $('#show_hide_password i');

        if (input.attr("type") === "text") {

            input.attr('type', 'password');

            icon.addClass("bx-hide");
            icon.removeClass("bx-show");

        } else {

            input.attr('type', 'text');

            icon.removeClass("bx-hide");
            icon.addClass("bx-show");

        }

    });


    var forms =
        document.querySelectorAll('.needs-validation');


    Array.prototype.slice.call(forms)
        .forEach(function (form) {

            form.addEventListener(
                'submit',
                function (event) {

                    if (!form.checkValidity()) {

                        event.preventDefault();
                        event.stopPropagation();

                    } else {

                        let btn =
                            form.querySelector('[type="submit"]');

                        btn.disabled = true;

                        btn.innerText =
                            "CARREGANDO ...";
                    }

                    form.classList.add('was-validated');

                },
                false
            );

        });

});

</script>

<script>

function onTurnstileSuccess(token) {

    var botao =
        document.getElementById('submitBtn');

    botao.innerHTML =
        '<i class="bx bx-lock-open pb-1"></i> ENTRAR';

    botao.disabled = false;

    botao.classList.remove('disabled');
}


function onTurnstileError() {

    var botao =
        document.getElementById('submitBtn');

    botao.innerHTML =
        '<i class="bx bx-loader bx-spin pb-1"></i> ATUALIZE A PAGINA';

    botao.disabled = true;

    botao.classList.add('disabled');
}


var forms =
    document.querySelectorAll('.needs-validation');


Array.prototype.slice.call(forms)
    .forEach(function (form) {

        form.addEventListener(
            'submit',
            function (event) {

                if (!form.checkValidity()) {

                    event.preventDefault();
                    event.stopPropagation();

                } else {

                    let btn =
                        form.querySelector('[type="submit"]');

                    btn.disabled = true;

                    btn.innerText =
                        "CARREGANDO ...";

                form.classList.add('was-validated');

            },
            false
        );

    });

</script>
