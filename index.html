<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Cliente</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff8800,#ff0000);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:380px;
    background:#fff;
    border-radius:25px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    text-align:center;
}

.logo{
    width:280px;
    margin-bottom:25px;
}

h2{
    color:#222;
    margin-bottom:10px;
    font-size:38px;
}

p{
    color:#666;
    margin-bottom:35px;
    font-size:18px;
}

.botao{
    display:block;
    width:100%;
    background:linear-gradient(45deg,#ff9500,#ff5a00);
    color:#fff;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    transition:.3s;
}

.botao:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,.25);
}

.divisor{
    margin:30px 0;
    color:#888;
    font-size:18px;
}

.botao2{
    display:block;
    width:100%;
    border:2px solid #ff6a00;
    color:#ff6a00;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.botao2:hover{
    background:#ff6a00;
    color:#fff;
}
</style>

</head>
<body>

<div class="card">

<img src="logo.png" class="logo" alt="Painel Cliente">

<h2>Bem-vindo(a)</h2>

<p>Faça login para continuar</p>

<a class="botao" href="https://clientefinal.com/">
🔒 LOGIN E PASSWORD
</a>

<div class="divisor">
OU
</div>

<a class="botao2" href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a">
👤 NÃO TEM LOGIN?<br>
CRIE AQUI E GANHE<br>
4 HORAS DE TESTE GRÁTIS
</a>

</div>

</body>
</html>
