<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PainelCliente</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* VÍDEO DE FUNDO */
.video-fundo{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;
}

/* CAMADA ESCURA */
.overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.45);

    z-index:1;
}

/* CONTEÚDO */
.container{

    position:relative;

    z-index:2;

    width:100%;
    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:20px;
}

/* TÍTULO */
.titulo{

    color:#fff;

    font-size:30px;

    font-weight:bold;

    margin-bottom:25px;

    text-align:center;

    text-shadow:0 0 12px rgba(255,106,0,0.6);
}

/* BOTÕES */
.botoes{

    width:100%;

    max-width:350px;

    display:flex;

    flex-direction:column;

    gap:15px;
}

.botao{

    display:block;

    width:100%;

    padding:16px 20px;

    border:2px solid #ff6a00;

    border-radius:12px;

    background:rgba(0,0,0,0.18);

    color:#fff;

    text-align:center;

    text-decoration:none;

    font-size:16px;

    font-weight:bold;

    backdrop-filter:blur(4px);

    -webkit-backdrop-filter:blur(4px);

    transition:0.3s;
}

.botao:hover{

    background:rgba(255,106,0,0.12);

    box-shadow:0 0 18px rgba(255,106,0,0.45);

    transform:scale(1.02);
}

/* CELULAR */
@media(max-width:480px){

    .titulo{
        font-size:25px;
    }

    .botoes{
        max-width:330px;
    }

    .botao{
        padding:15px;
        font-size:15px;
    }

}

</style>

</head>

<body>

<!-- VÍDEO -->
<video
    class="video-fundo"
    autoplay
    muted
    loop
    playsinline>

    <source src="video.mp4" type="video/mp4">

</video>


<!-- ESCURECIMENTO -->
<div class="overlay"></div>


<!-- CONTEÚDO -->
<div class="container">

    <div class="titulo">
        PainelCliente
    </div>

    <div class="botoes">

        <a
            href="https://clientefinal.com/"
            class="botao"
            target="_blank">

            🎥 Assistir Filmes e Séries

        </a>


        <a
            href="https://testeagora.tv/"
            class="botao"
            target="_blank">

            🎁 Solicitar Teste Grátis

        </a>

    </div>

</div>

</body>

</html>
