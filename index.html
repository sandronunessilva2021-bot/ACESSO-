<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PainelCliente</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Fundo escuro */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:1;
}

/* Conteúdo principal */
.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:500px;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:25px;
}

/* Título */
h1{
    font-size:28px;
    margin-bottom:20px;
    color:#fff;
    text-align:center;
}

/* Botões */
.btn{
    width:100%;
    max-width:360px;

    padding:15px 20px;

    border:2px solid #ff6a00;
    border-radius:12px;

    background:rgba(0,0,0,0.25);

    color:#fff;
    text-decoration:none;

    text-align:center;
    font-size:16px;
    font-weight:bold;

    transition:0.3s;

    backdrop-filter:blur(4px);
}

/* Efeito ao tocar */
.btn:hover{
    background:rgba(255,106,0,0.15);
    box-shadow:0 0 15px rgba(255,106,0,0.4);
    transform:scale(1.02);
}

/* Espaçamento do botão superior */
.btn-top{
    margin-bottom:18px;
}

/* Vídeo */
.video-box{
    width:100%;
    max-width:420px;

    aspect-ratio:16 / 9;

    border-radius:14px;
    overflow:hidden;

    border:1px solid rgba(255,106,0,0.45);

    background:#111;

    box-shadow:
        0 0 20px rgba(255,106,0,0.12);
}

.video-box video{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

/* Espaçamento do botão inferior */
.btn-bottom{
    margin-top:18px;
}

/* Celular */
@media(max-width:480px){

    .container{
        padding:20px;
    }

    h1{
        font-size:24px;
    }

    .video-box{
        max-width:100%;
    }

    .btn{
        font-size:15px;
        padding:14px;
    }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <h1>PainelCliente</h1>

    <!-- BOTÃO DE CIMA -->
    <a
        class="btn btn-top"
        href="https://clientefinal.com/"
        target="_blank">
        🎥 Assistir Filmes e Séries
    </a>

    <!-- VÍDEO NO MEIO -->
    <div class="video-box">

        <video
            autoplay
            muted
            loop
            playsinline
            controls>

            <!-- COLOQUE AQUI O LINK DO SEU VÍDEO MP4 -->
            <source
                src="SEU_VIDEO.mp4"
                type="video/mp4">

            Seu navegador não suporta vídeo.
        </video>

    </div>

    <!-- BOTÃO DE BAIXO -->
    <a
        class="btn btn-bottom"
        href="https://testeagora.tv/"
        target="_blank">
        🎁 Solicitar Teste Grátis
    </a>

</div>

</body>
</html>
