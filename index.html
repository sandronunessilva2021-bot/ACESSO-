
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020609">
  <title>Painel Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 50%, rgba(13, 40, 78, 0.65) 0%, rgba(5, 17, 34, 0.85) 38%, #01050a 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
    }

    .painel {
      width: min(850px, 100%);
      min-height: 1290px;
      background:
        radial-gradient(circle at 50% 30%, rgba(10, 20, 27, 0.28), transparent 45%),
        #020609;
      border: 3px solid #252b32;
      border-radius: 42px;
      box-shadow:
        0 0 60px rgba(5, 28, 60, 0.75),
        inset 0 0 60px rgba(0, 0, 0, 0.55);
      padding: 145px 68px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      text-align: center;
      margin-bottom: 70px;
    }

    .linha {
      width: 78%;
      height: 4px;
      margin-bottom: 205px;
      background: linear-gradient(
        90deg,
        transparent,
        #ff8500 20%,
        #ff9d00 50%,
        #ff8500 80%,
        transparent
      );
      box-shadow: 0 0 14px #ff8500, 0 0 28px rgba(255, 133, 0, 0.55);
      border-radius: 50%;
    }

    .botoes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 56px;
    }

    .botao {
      min-height: 185px;
      width: 100%;
      border: 4px solid #ff8a00;
      border-radius: 30px;
      background: linear-gradient(145deg, #03080b, #05090c);
      color: #ff8a00;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 45px;
      padding: 30px 35px;
      text-align: center;
      box-shadow:
        0 0 18px rgba(255, 138, 0, 0.08),
        inset 0 0 25px rgba(255, 138, 0, 0.025);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .botao:hover {
      transform: translateY(-4px);
      background: #080d11;
      box-shadow:
        0 0 25px rgba(255, 138, 0, 0.28),
        0 0 50px rgba(255, 138, 0, 0.08),
        inset 0 0 25px rgba(255, 138, 0, 0.04);
    }

    .icone {
      width: 78px;
      min-width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      line-height: 1;
      filter: drop-shadow(0 0 7px rgba(255, 138, 0, 0.2));
    }

    .texto {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .titulo {
      font-size: clamp(27px, 4vw, 45px);
      font-weight: 800;
      line-height: 1.15;
    }

    .subtitulo {
      font-size: clamp(19px, 2.6vw, 29px);
      font-weight: 700;
      margin-top: 10px;
      line-height: 1.2;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .painel {
        min-height: 96vh;
        border-radius: 28px;
        border-width: 2px;
        padding: 80px 22px 70px;
      }

      h1 {
        letter-spacing: -1px;
        margin-bottom: 45px;
      }

      .linha {
        width: 90%;
        margin-bottom: 105px;
      }

      .botoes {
        gap: 28px;
      }

      .botao {
        min-height: 145px;
        border-width: 3px;
        border-radius: 24px;
        gap: 18px;
        padding: 22px 15px;
      }

      .icone {
        width: 54px;
        min-width: 54px;
        height: 54px;
        font-size: 42px;
      }

      .titulo {
        font-size: 25px;
      }

      .subtitulo {
        font-size: 17px;
      }
    }

    @media (max-width: 430px) {
      .painel {
        padding: 65px 14px 55px;
      }

      h1 {
        font-size: 40px;
      }

      .linha {
        margin-bottom: 85px;
      }

      .botao {
        min-height: 125px;
        gap: 10px;
        padding: 18px 10px;
      }

      .icone {
        width: 44px;
        min-width: 44px;
        font-size: 35px;
      }

      .titulo {
        font-size: 21px;
      }

      .subtitulo {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="painel">
    <h1>PAINEL LOGIN</h1>

    <div class="linha"></div>

    <section class="botoes">

      <!-- Botão de Login -->
      <a
        class="botao"
        href="https://clientefinal.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acessar o painel de login"
      >
        <span class="icone" aria-hidden="true">🔒</span>

        <span class="texto">
          <span class="titulo">PAINEL LOGIN</span>
        </span>
      </a>

      <!-- Botão para criar login e ganhar teste grátis -->
      <a
        class="botao"
        href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Criar seu login e ganhar 4 horas de teste grátis"
      >
        <span class="icone" aria-hidden="true">🎁</span>

        <span class="texto">
          <span class="titulo">CRIE SEU LOGIN AQUI</span>
          <span class="subtitulo">E GANHE 4 HORAS DE TESTE GRÁTIS</span>
        </span>
      </a>

    </section>
  </main>

</body>
</html>
