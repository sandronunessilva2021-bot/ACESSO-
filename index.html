<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#000000">

    <meta name="description"
          content="PainelCliente - Acesso rápido e simples">

    <title>PainelCliente</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #000;

            color: #fff;

            overflow: hidden;
        }


        /* =========================
           VÍDEO DE FUNDO
        ========================= */

        .video-background {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -3;

            background: #000;
        }


        /* =========================
           CAMADA ESCURA SOBRE O VÍDEO
        ========================= */

        .overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    rgba(0,0,0,0.72),
                    rgba(0,0,0,0.82)
                );

            z-index: -2;
        }


        /* =========================
           EFEITO LARANJA
        ========================= */

        .orange-glow {

            position: fixed;

            width: 350px;
            height: 350px;

            background: #ff6a00;

            border-radius: 50%;

            filter: blur(150px);

            opacity: .15;

            top: 10%;
            left: 50%;

            transform: translateX(-50%);

            z-index: -1;
        }


        /* =========================
           PÁGINA
        ========================= */

        .page {

            width: 100%;
            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            position: relative;
        }


        /* =========================
           CONTEÚDO
        ========================= */

        .container {

            width: 100%;

            max-width: 480px;

            text-align: center;

            animation: aparecer 1s ease;
        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            width: 100px;
            height: 100px;

            margin: 0 auto 18px;

            border-radius: 28px;

            display: flex;

            justify-content: center;
            align-items: center;

            background:
                rgba(0,0,0,.55);

            border:
                2px solid
                rgba(255,106,0,.8);

            box-shadow:
                0 0 25px
                rgba(255,106,0,.35);

            font-size: 48px;
        }


        /* =========================
           TÍTULO
        ========================= */

        .title {

            font-size:
                clamp(35px, 9vw, 55px);

            font-weight: 900;

            letter-spacing: 1px;

            text-transform:
                uppercase;

            margin-bottom: 8px;

            text-shadow:
                0 3px 20px
                rgba(0,0,0,.9);
        }


        .title span {

            color: #ff6a00;

            text-shadow:
                0 0 20px
                rgba(255,106,0,.35);
        }


        /* =========================
           SUBTÍTULO
        ========================= */

        .subtitle {

            color: #ddd;

            font-size: 16px;

            line-height: 1.5;

            margin-bottom: 35px;

            text-shadow:
                0 2px 8px #000;
        }


        /* =========================
           BOTÕES
        ========================= */

        .buttons {

            display: flex;

            flex-direction: column;

            gap: 16px;

            width: 100%;
        }


        .button {

            width: 100%;

            min-height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            border-radius: 16px;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

            color: #fff;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);
        }


        /* LOGIN */

        .login-button {

            background:
                rgba(255,106,0,.78);

            border:
                1px solid
                rgba(255,160,80,.8);

            box-shadow:
                0 8px 30px
                rgba(255,106,0,.25);
        }


        .login-button:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,106,0,.95);

            box-shadow:
                0 10px 35px
                rgba(255,106,0,.45);
        }


        /* TESTE */

        .test-button {

            background:
                rgba(35,190,0,.72);

            border:
                1px solid
                rgba(100,255,70,.75);

            box-shadow:
                0 8px 30px
                rgba(35,190,0,.20);
        }


        .test-button:hover {

            transform:
                translateY(-3px);

            background:
                rgba(35,190,0,.92);

            box-shadow:
                0 10px 35px
                rgba(35,190,0,.40);
        }


        .icon {

            font-size: 25px;
        }


        /* =========================
           INFORMAÇÕES
        ========================= */

        .info {

            display: flex;

            justify-content:
                center;

            gap: 25px;

            flex-wrap: wrap;

            margin-top: 28px;

            color: #ccc;

            font-size: 12px;
        }


        .info-item {

            display: flex;

            align-items: center;

            gap: 6px;
        }


        .info-item span {

            color: #ff6a00;

            font-size: 16px;
        }


        /* =========================
           RODAPÉ
        ========================= */

        .footer {

            position: fixed;

            bottom: 15px;

            left: 0;

            width: 100%;

            text-align: center;

            color: rgba(255,255,255,.55);

            font-size: 11px;

            padding: 0 15px;
        }


        .footer strong {

            color: #ff6a00;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            .page {

                padding:
                    20px;
            }


            .logo {

                width: 82px;
                height: 82px;

                font-size: 38px;

                border-radius: 23px;
            }


            .title {

                font-size: 38px;
            }


            .subtitle {

                font-size: 14px;

                margin-bottom: 28px;
            }


            .button {

                min-height: 60px;

                font-size: 16px;

                border-radius: 14px;
            }


            .info {

                gap: 15px;

                margin-top: 22px;
            }

        }


        /* =========================
           CELULAR PEQUENO
        ========================= */

        @media (max-height: 650px) {

            .logo {

                width: 65px;
                height: 65px;

                font-size: 30px;

                margin-bottom: 10px;
            }


            .title {

                font-size: 32px;
            }


            .subtitle {

                margin-bottom: 18px;
            }


            .button {

                min-height: 52px;
            }


            .info {

                margin-top: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         VÍDEO
    ========================= -->

    <video
        class="video-background"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <!--
        COLOQUE SEU VÍDEO AQUI

        Se o arquivo estiver junto do index.html,
        use:

        video.mp4
        -->

        <source
            src="video.mp4"
            type="video/mp4">

    </video>


    <!-- CAMADA ESCURA -->

    <div class="overlay"></div>


    <!-- EFEITO -->

    <div class="orange-glow"></div>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================= -->

    <main class="page">

        <div class="container">


            <!-- LOGO -->

            <div class="logo">
                🎬
            </div>


            <!-- TÍTULO -->

            <h1 class="title">

                PAINEL
                <span>CLIENTE</span>

            </h1>


            <!-- SUBTÍTULO -->

            <p class="subtitle">

                Acesse sua conta ou
                solicite seu teste grátis.

                <br>

                Rápido, simples e direto.

            </p>


            <!-- =========================
                 BOTÕES
            ========================= -->

            <div class="buttons">


                <!-- LOGIN -->

                <a
                    href="https://SEU-LINK-DE-LOGIN.com"
                    class="button login-button"
                    target="_blank"
                    rel="noopener">

                    <span class="icon">
                        👤
                    </span>

                    LOGIN E SENHA

                </a>


                <!-- TESTE GRÁTIS -->

                <a
                    href="https://SEU-LINK-DE-TESTE.com"
                    class="button test-button"
                    target="_blank"
                    rel="noopener">

                    <span class="icon">
                        🎁
                    </span>

                    TESTE GRÁTIS

                </a>


            </div>


            <!-- =========================
                 INFORMAÇÕES
            ========================= -->

            <div class="info">

                <div class="info-item">

                    <span>⚡</span>

                    Acesso rápido

                </div>


                <div class="info-item">

                    <span>📱</span>

                    Celular

                </div>


                <div class="info-item">

                    <span>📺</span>

                    Smart TV

                </div>

            </div>


        </div>

    </main>


    <!-- =========================
         RODAPÉ
    ========================= -->

    <div class="footer">

        © 2026
        <strong>PainelCliente</strong>
        • Todos os direitos reservados

    </div>


</body>

</html>
