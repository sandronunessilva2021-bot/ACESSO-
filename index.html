<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Cliente</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7a00,#ff0033);
}

.card{
    width:380px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.logo{
    width:120px;
    height:120px;
    margin:auto;
    margin-bottom:20px;
    display:block;
}

h2{
    text-align:center;
    margin-bottom:10px;
    color:#333;
}

p{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
    font-size:16px;
}

.input:focus{
    border-color:#ff7a00;
}

.login{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#ff8800,#ff5500);
    color:#fff;
    font-size:17px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.login:hover{
    transform:translateY(-2px);
}

.teste{
    display:block;
    text-decoration:none;
    text-align:center;
    margin-top:18px;
    padding:16px;
    border-radius:10px;
    font-weight:bold;
    font-size:17px;
    color:#fff;
    background:linear-gradient(45deg,#00c853,#00e676);
    transition:.3s;
}

.teste:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,200,83,.4);
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#999;
    font-size:13px;
}

@media(max-width:450px){

.card{
    width:95%;
}

}
</style>

</head>
<body>

<div class="card">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="logo">

<h2>Bem-vindo(a)</h2>

<p>Faça login para continuar</p>

<form>

<input
class="input"
type="text"
placeholder="Digite seu Login"
required>

<input
class="input"
type="password"
placeholder="Digite sua Senha"
required>

<button class="login">
🔐 ENTRAR
</button>

</form>

<a
class="teste"
href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014ade"
target="_blank">
🎁 CRIE SEU TESTE GRÁTIS POR 4 HORAS
</a>

<div class="footer">
Painel do Cliente © 2026
</div>

</div>

</body>
</html>
