<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Cliente</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff8800,#ff1a1a);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:380px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    width:120px;
    display:block;
    margin:0 auto 20px;
}

h2{
    text-align:center;
    margin-bottom:8px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button,
a.botao{
    width:100%;
    display:block;
    text-align:center;
    padding:14px;
    border-radius:10px;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    border:none;
    cursor:pointer;
    transition:.3s;
}

button{
    background:#ff8800;
    color:white;
}

button:hover{
    background:#ff6a00;
}

a.botao{
    margin-top:12px;
    background:#ff8800;
    color:#fff;
}

a.botao:hover{
    background:#ff6a00;
}
</style>

</head>
<body>

<div class="card">

<img src="logo.png" class="logo" alt="Logo">

<h2>Bem-vindo(a)</h2>

<p>Faça login para continuar</p>

<form>

<input type="text" placeholder="Digite seu Login">

<input type="password" placeholder="Digite sua Senha">

<button type="submit">
ENTRAR
</button>

<a class="botao"
href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a">
NÃO TEM LOGIN?<br>
CRIE AQUI E GANHE 4 HORAS DE TESTE GRÁTIS
</a>

</form>

</div>

</body>
</html>
