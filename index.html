<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Play</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
color:#fff;
overflow:hidden;
}

/* VÍDEO DE FUNDO */

#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:-1;
}

/* CONTEÚDO */

.container{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:25px;
text-align:center;
}

/* TÍTULO */

h1{
font-size:42px;
margin-bottom:10px;

color:#c65cff;

text-shadow:
0 0 5px #b000ff,
0 0 15px #b000ff,
0 0 30px #8a00ff;
}

/* DESCRIÇÃO */

.sub{
font-size:18px;
color:#fff;
margin-bottom:25px;
}

.sub strong{
color:#c65cff;

text-shadow:
0 0 8px #b000ff;
}

/* BOTÕES */

.btn{
width:100%;

display:block;

text-decoration:none;

padding:18px 15px;

margin-top:15px;

border-radius:18px;

font-size:20px;

font-weight:bold;

color:#fff;

background:rgba(0,0,0,.35);

border:2px solid #b000ff;

box-shadow:
0 0 8px rgba(176,0,255,.8),
inset 0 0 10px rgba(176,0,255,.15);

text-shadow:
0 0 8px #b000ff;

transition:.3s;
}

.btn:hover{
transform:scale(1.03);

box-shadow:
0 0 15px #b000ff,
0 0 30px rgba(176,0,255,.7);
}

.btn:active{
transform:scale(.97);
}

/* TEXTO PEQUENO */

.btn small{
display:block;

margin-top:7px;

font-size:14px;

font-weight:normal;

color:#ddd;

text-shadow:none;
}

/* CELULAR */

@media(max-width:600px){

h1{
font-size:36px;
}

.sub{
font-size:16px;
}

.btn{
font-size:18px;
}

}

</style>

</head>

<body>


<!-- VÍDEO -->

<video
autoplay
muted
loop
playsinline
id="bg-video">

<source
src="6e0435cdf73692771097c0abcf882e37.mp4"
type="video/mp4">

</video>


<div class="overlay"></div>


<!-- CONTEÚDO -->

<div class="container">

<h1>Smart Play</h1>

<p class="sub">
Filmes • Séries • <strong>Jogos ao Vivo</strong> • Ao Vivo
</p>


<!-- TESTE -->

<a
class="btn"
href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a"
target="_blank">

🎁 CRIE SEU LOGIN E SENHA AQUI

<small>
Aproveite 4 horas grátis
</small>

</a>


<!-- PAINEL -->

<a
class="btn"
href="https://clientefinal.com/"
target="_blank">

🔐 PAINEL DO CLIENTE

<small>
Entrar com seu login e senha
</small>

</a>

</div>


<script>

/* EFEITO AO CLICAR */

document.querySelectorAll(".btn").forEach((botao) => {

botao.addEventListener("click", function(){

this.style.transform = "scale(.97)";

setTimeout(() => {

this.style.transform = "scale(1)";

},150);

});

});

</script>

</body>

</html>
