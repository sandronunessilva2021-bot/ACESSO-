<title>Portal do Cliente</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* Vídeo de fundo */
#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* Camada escura */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
z-index:-1;
}

/* Conteúdo */
.container{
width:100%;
max-width:420px;
padding:30px;
text-align:center;
}

/* Título */
h1{
color:#fff;
font-size:42px;
margin-bottom:45px;
text-shadow:0 4px 15px rgba(0,0,0,.6);
}

/* Botões */
/* Botões */
.btn{
display:block;
width:100%;
text-decoration:none;
color:#fff;
background:rgba(255,255,255,0.10); /* Branco bem transparente */
padding:18px;
font-size:22px;
font-weight:bold;
border-radius:18px;
border:1px solid rgba(255,255,255,0.25);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
box-shadow:0 8px 25px rgba(0,0,0,.25);
transition:.3s;
margin-top:18px;
}

.btn:hover{
background:rgba(255,255,255,0.18);
border:1px solid rgba(255,255,255,0.35);
transform:scale(1.03);
}

.btn:active{
transform:scale(.98);
}

.btn:hover{
background:rgba(255,140,0,0.65);
transform:scale(1.03);
}

.btn:active{
transform:scale(.98);
}
</style>

</head>
