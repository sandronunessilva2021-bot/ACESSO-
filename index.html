<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guia de Filmes</title>
  <meta name="description" content="Catálogo de filmes">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header-content">

    <a href="index.html" class="logo">
      GUIA<span>FILMES</span>
    </a>

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="🔎 Pesquisar filme..."
        autocomplete="off"
      >
    </div>

  </div>
</header>


<!-- BOTÕES -->
<section class="top-buttons">

  <a
    href="https://clientefinal.com/"
    target="_blank"
    rel="noopener noreferrer"
    class="btn-client"
  >
    🔐 ACESSAR ÁREA DO CLIENTE
  </a>

  <a
    href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014ade"
    target="_blank"
    rel="noopener noreferrer"
    class="btn-test"
  >
    🎁 CRIE SEU TESTE GRÁTIS POR 4 HORAS
  </a>

</section>


<main class="container">

  <section class="intro">
    <h1>Filmes</h1>
    <p>Encontre seus filmes favoritos.</p>
  </section>


  <!-- CATEGORIAS -->
  <nav class="categories" id="categories">

    <button class="category active" data-category="Todos">
      Todos
    </button>

    <button class="category" data-category="Ação">
      Ação
    </button>

    <button class="category" data-category="Comédia">
      Comédia
    </button>

    <button class="category" data-category="Drama">
      Drama
    </button>

    <button class="category" data-category="Terror">
      Terror
    </button>

    <button class="category" data-category="Ficção">
      Ficção
    </button>

    <button class="category" data-category="Animação">
      Animação
    </button>

  </nav>


  <div class="section-header">
    <h2>Filmes recentes</h2>
    <span id="resultCount"></span>
  </div>


  <!-- FILMES -->
  <section id="moviesGrid" class="movies-grid"></section>


  <!-- SEM RESULTADO -->
  <div id="noResults" class="no-results">
    Nenhum filme encontrado.
  </div>


  <!-- PAGINAÇÃO -->
  <div class="pagination" id="pagination"></div>


</main>


<footer>
  <p>© 2026 Guia Filmes</p>
</footer>


<script src="script.js"></script>

</body>
</html>
