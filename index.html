<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Play</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,
body{
width:100%;
height:100%;
}

body{
background:#000;
color:#fff;
overflow:hidden;
}


/* =========================
   VÍDEO DE FUNDO
========================= */

#bg-video{
position:fixed;
top:0;
left:0;

width:100%;
height:100%;

object-fit:cover;

z-index:-2;
}


/* CAMADA LEVE */

.overlay{
position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.10);

z-index:-1;
}


/* =========================
   CONTEÚDO
========================= */

.container{

width:100%;
max-width:430px;

min-height:100vh;

margin:auto;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:25px;

text-align:center;

}


/* =========================
   TÍTULO
========================= */

h1{

font-size:42px;

margin-bottom:10px;

color:#d8d8d8;

font-weight:bold;

}


/* =========================
   DESCRIÇÃO
========================= */

.sub{

font-size:18px;

color:#d8d8d8;

margin-bottom:25px;

}

.sub strong{

color:#ffffff;

font-weight:bold;

}


/* =========================
   BOTÕES
========================= */

.btn{

width:100%;

display:block;

text-decoration:none;

padding:18px 15px;

margin-top:15px;

border-radius:18px;

font-size:20px;

font-weight:bold;

color:#eeeeee;

background:rgba(0,0,0,.25);

border:2px solid #cfcfcf;

transition:.3s;

}


/* EFEITO AO PASSAR */

.btn:hover{

background:rgba(255,255,255,.08);

}


/* EFEITO AO CLICAR */

.btn:active{

transform:scale(.97);

}


/* =========================
   TEXTO PEQUENO
========================= */

.btn small{

display:block;

margin-top:7px;

font-size:14px;

font-weight:normal;

color:#cfcfcf;

}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

h1{

font-size:36px;

}

.sub{

font-size:16px;

}

.btn{

font-size:18px;

padding:17px 12px;

}

.btn small{

font-size:13px;

}

}

</style>

</head>


<body>


<!-- VÍDEO -->

<video
autoplay
muted
loop
playsinline
id="bg-video">

<source
src="6e0435cdf73692771097c0abcf882e37.mp4"
type="video/mp4">

Seu navegador não suporta vídeo.

</video>


<div class="overlay"></div>


<!-- CONTEÚDO -->

<div class="container">


<h1>Smart Play</h1>


<p class="sub">

Filmes • Séries •
<strong>Jogos ao Vivo</strong> • Ao Vivo

</p>


<!-- TESTE -->

<a
class="btn"
href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a"
target="_blank"
rel="noopener noreferrer">

🎁 CRIE SEU LOGIN E SENHA AQUI

<small>

Aproveite 4 horas grátis

</small>

</a>


<!-- PAINEL -->

<a
class="btn"
href="https://clientefinal.com/"
target="_blank"
rel="noopener noreferrer">

🔐 PAINEL DO CLIENTE

<small>

Entrar com seu login e senha

</small>

</a>


</div>


<script>

/* EFEITO AO CLICAR */

document
.querySelectorAll(".btn")
.forEach((botao) => {

botao.addEventListener("click", function(){

this.style.transform = "scale(.97)";

setTimeout(() => {

this.style.transform = "scale(1)";

},150);

});

});

</script>


</body>

</html>
