<title>Central de Acesso</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* Vídeo de Fundo */
#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Escurece o vídeo */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.35);
    z-index:-1;
}

/* Caixa */
.container{
    width:420px;
    max-width:90%;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

h1{
    color:#222;
    font-size:34px;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:30px;
}

/* Botões */
.btn{
    display:block;
    text-decoration:none;
    background:linear-gradient(90deg,#ff8c00,#ff5500);
    color:#fff;
    padding:17px;
    margin:15px 0;
    border-radius:12px;
    font-size:19px;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.btn:hover{
    transform:scale(1.03);
}

/* Mercado Pago */
.mp{
    background:#fff;
    color:#009EE3;
    border:2px solid #009EE3;
}

.mp:hover{
    background:#009EE3;
    color:#fff;
}
</style>

</head>
