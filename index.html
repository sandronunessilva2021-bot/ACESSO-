<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>PAINEL LOGIN</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }


    /* =========================
       VÍDEO DE FUNDO
    ========================= */

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: -3;

      background: #000;
    }


    /* =========================
       CAMADA ESCURA SOBRE O VÍDEO
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0.45) 0%,
          rgba(0, 0, 0, 0.70) 55%,
          rgba(0, 0, 0, 0.90) 100%
        );

      z-index: -2;

      pointer-events: none;
    }


    /* =========================
       CONTEÚDO
    ========================= */

    .container {
      width: 100%;
      max-width: 850px;

      min-height: 100vh;

      margin: 0 auto;

      padding: 70px 16px 40px;

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       TÍTULO
    ========================= */

    h1 {
      font-size: clamp(42px, 7vw, 78px);

      font-weight: 800;

      line-height: 1;

      letter-spacing: -2px;

      color: #fff;

      margin-bottom: 18px;

      text-shadow:
        0 3px 15px rgba(0, 0, 0, 0.95),
        0 0 25px rgba(255, 255, 255, 0.10);
    }


    .sub {
      font-size: clamp(18px, 3vw, 25px);

      font-weight: 600;

      color: #fff;

      margin-bottom: 35px;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9);
    }


    /* =========================
       LINHA LARANJA
    ========================= */

    .linha {
      width: 78%;

      max-width: 650px;

      height: 3px;

      margin-bottom: 70px;

      background: linear-gradient(
        90deg,
        transparent,
        #ff8500 20%,
        #ff9d00 50%,
        #ff8500 80%,
        transparent
      );

      box-shadow:
        0 0 10px #ff8500,
        0 0 25px rgba(255, 133, 0, 0.65);

      border-radius: 50%;
    }


    /* =========================
       BOTÕES
    ========================= */

    .botoes {
      width: 100%;

      max-width: 760px;

      display: flex;

      flex-direction: column;

      gap: 28px;
    }


    .btn {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 25px;

      width: 100%;

      min-height: 145px;

      padding: 25px 30px;

      border-radius: 28px;

      text-decoration: none;

      color: #ff8a00;

      background:
        rgba(0, 0, 0, 0.82);

      border: 3px solid #ff8a00;

      box-shadow:
        0 0 18px rgba(255, 138, 0, 0.12),
        0 0 35px rgba(0, 0, 0, 0.85),
        inset 0 0 25px rgba(255, 138, 0, 0.025);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }


    /* =========================
       HOVER
    ========================= */

    .btn:hover {
      transform: translateY(-4px);

      background:
        rgba(8, 12, 15, 0.94);

      box-shadow:
        0 0 25px rgba(255, 138, 0, 0.30),
        0 0 55px rgba(255, 138, 0, 0.10),
        inset 0 0 25px rgba(255, 138, 0, 0.04);
    }


    .btn:active {
      transform: scale(0.97);
    }


    /* =========================
       ÍCONES
    ========================= */

    .icone {
      width: 70px;

      min-width: 70px;

      height: 70px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 52px;

      line-height: 1;

      filter:
        drop-shadow(
          0 0 7px rgba(255, 138, 0, 0.35)
        );
    }


    /* =========================
       TEXTO DOS BOTÕES
    ========================= */

    .texto {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }


    .titulo {
      font-size: clamp(25px, 4vw, 42px);

      font-weight: 800;

      line-height: 1.15;

      color: #ff8a00;

      text-shadow:
        0 0 8px rgba(255, 138, 0, 0.12);
    }


    .subtitulo {
      font-size: clamp(16px, 2.5vw, 25px);

      font-weight: 700;

      margin-top: 9px;

      line-height: 1.2;

      color: #ff8a00;
    }


    /* =========================
       RODAPÉ
    ========================= */

    footer {
      margin-top: 45px;

      padding-bottom: 30px;

      font-size: 14px;

      color: #fff;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9);
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 700px) {

      .container {
        padding:
          55px
          16px
          35px;
      }

      h1 {
        font-size: 42px;

        letter-spacing: -1px;
      }

      .sub {
        font-size: 18px;

        margin-bottom: 28px;
      }

      .linha {
        width: 90%;

        margin-bottom: 55px;
      }

      .botoes {
        gap: 24px;
      }

      .btn {
        min-height: 135px;

        border-width: 3px;

        border-radius: 24px;

        gap: 18px;

        padding: 22px 18px;
      }

      .icone {
        width: 55px;

        min-width: 55px;

        height: 55px;

        font-size: 42px;
      }

      .titulo {
        font-size: 25px;
      }

      .subtitulo {
        font-size: 17px;
      }
    }


    /* =========================
       CELULAR PEQUENO
    ========================= */

    @media (max-width: 430px) {

      .container {
        padding:
          45px
          16px
          30px;
      }

      h1 {
        font-size: 38px;
      }

      .sub {
        font-size: 16px;
      }

      .linha {
        margin-bottom: 45px;
      }

      .btn {
        min-height: 120px;

        border-radius: 22px;

        gap: 10px;

        padding: 18px 12px;
      }

      .icone {
        width: 44px;

        min-width: 44px;

        height: 44px;

        font-size: 35px;
      }

      .titulo {
        font-size: 21px;
      }

      .subtitulo {
        font-size: 15px;
      }

      footer {
        font-size: 13px;
      }
    }


    /* =========================
       CELULAR MUITO PEQUENO
    ========================= */

    @media (max-width: 350px) {

      h1 {
        font-size: 33px;
      }

      .btn {
        min-height: 110px;

        padding: 15px 8px;
      }

      .icone {
        width: 38px;

        min-width: 38px;

        font-size: 30px;
      }

      .titulo {
        font-size: 19px;
      }

      .subtitulo {
        font-size: 14px;
      }
    }

  </style>

</head>


<body>


  <!-- =========================
       VÍDEO MP4 DE FUNDO
  ========================= -->

  <video
    id="bg-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    aria-hidden="true"
  >

    <source
      src="6e0435cdf73692771097c0abcf882e37.mp4"
      type="video/mp4"
    >

    Seu navegador não suporta vídeo.

  </video>


  <!-- CAMADA ESCURA -->

  <div class="overlay"></div>


  <!-- =========================
       CONTEÚDO
  ========================= -->

  <main class="container">


    <!-- TÍTULO -->

    <h1>
      PAINEL LOGIN
    </h1>


    <p class="sub">
      Acesse sua conta ou crie seu login
    </p>


    <!-- LINHA -->

    <div class="linha"></div>


    <!-- =========================
         BOTÕES
    ========================= -->

    <section class="botoes">


      <!-- =========================
           PAINEL LOGIN
      ========================= -->

      <a
        class="btn"
        href="https://clientefinal.com/"
        rel="noopener noreferrer"
        aria-label="Acessar painel login"
      >

        <span
          class="icone"
          aria-hidden="true"
        >
          🔒
        </span>


        <span class="texto">

          <span class="titulo">
            PAINEL LOGIN
          </span>

          <span class="subtitulo">
            Entrar com seu login e senha
          </span>

        </span>

      </a>


      <!-- =========================
           CRIAR LOGIN
      ========================= -->

      <a
        class="btn"
        href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a"
        rel="noopener noreferrer"
        aria-label="Criar seu login e ganhar 4 horas de teste grátis"
      >

        <span
          class="icone"
          aria-hidden="true"
        >
          🎁
        </span>


        <span class="texto">

          <span class="titulo">
            CRIE SEU LOGIN AQUI
          </span>

          <span class="subtitulo">
            E GANHE 4 HORAS DE TESTE GRÁTIS
          </span>

        </span>

      </a>


    </section>


    <!-- =========================
         RODAPÉ
    ========================= -->

    <footer>
      PAINEL LOGIN © 2026
    </footer>


  </main>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       EFEITO DOS BOTÕES
    ========================= */

    document
      .querySelectorAll(".btn")
      .forEach(function(botao) {

        botao.addEventListener(
          "click",
          function() {

            this.style.transform =
              "scale(.97)";

            const elemento = this;

            setTimeout(function() {

              elemento.style.transform = "";

            }, 150);

          }
        );

      });


    /* =========================
       GARANTIR AUTOPLAY
    ========================= */

    window.addEventListener(
      "load",
      function() {

        const video =
          document.getElementById("bg-video");

        if (video) {

          video.muted = true;

          video.play().catch(
            function() {
              // Alguns navegadores podem
              // bloquear o autoplay.
            }
          );

        }

      }
    );

  </script>


</body>

</html>
