<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🍕 Pizza Play</title>

    <meta name="theme-color" content="#000000">

    <meta name="description"
          content="Pizza Play">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Pizza Play">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            background: #000;

            color: #fff;

            overflow-x: hidden;

        }


        body {

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        /* =================================
           ÁREA DO VÍDEO
        ================================= */

        .video-area {

            width: 100%;

            height: 50vh;

            position: relative;

            overflow: hidden;

            background: #000;

        }


        #bg-video {

            position: absolute;

            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            transform:
                translate(-50%, -50%);

            object-fit: cover;

            object-position:
                center center;

        }


        /* =================================
           CAMADA ESCURA DO VÍDEO
        ================================= */

        .video-overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.15),
                    rgba(0,0,0,.45)
                );

        }


        /* =================================
           ÁREA DOS BOTÕES
        ================================= */

        .content {

            width: 100%;

            min-height: 50vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding:
                25px 15px 35px;

            background: #000;

        }


        /* =================================
           TÍTULO
        ================================= */

        h1 {

            font-size: 32px;

            margin-bottom: 25px;

            color: #fff;

            text-align: center;

            text-shadow:
                0 0 15px
                rgba(255,255,255,.3);

        }


        /* =================================
           BOTÕES
        ================================= */

        .buttons {

            width: 100%;

            max-width: 600px;

        }


        .btn {

            display: block;

            width: 100%;

            padding:
                18px 15px;

            margin-top: 15px;

            text-align: center;

            text-decoration: none;

            color: #fff;

            font-size: 19px;

            font-weight: bold;

            border-radius: 17px;

            /* FUNDO TRANSPARENTE */

            background: transparent;

            /* BORDA LARANJA */

            border:
                1px solid #ff6a00;

            /* BRILHO */

            box-shadow:
                0 0 10px
                rgba(255,106,0,.25);

            backdrop-filter:
                blur(4px);

            -webkit-backdrop-filter:
                blur(4px);

            transition:
                .2s ease;

        }


        /* =================================
           HOVER / TOQUE
        ================================= */

        .btn:hover {

            background:
                rgba(255,106,0,.08);

            border-color:
                #ff6a00;

            box-shadow:
                0 0 20px
                rgba(255,106,0,.45);

            transform:
                scale(1.02);

        }


        .btn:active {

            transform:
                scale(.97);

            background:
                rgba(255,106,0,.12);

        }


        /* =================================
           TEXTO PEQUENO
        ================================= */

        .btn small {

            display: block;

            margin-top: 6px;

            font-size: 13px;

            font-weight: normal;

            color: #ddd;

        }


        /* =================================
           RODAPÉ
        ================================= */

        footer {

            margin-top: 25px;

            font-size: 12px;

            color: #888;

            text-align: center;

        }


        /* =================================
           CELULAR
        ================================= */

        @media (max-width: 600px) {

            .video-area {

                height: 50vh;

            }


            .content {

                min-height: 50vh;

                padding:
                    20px 12px 25px;

            }


            h1 {

                font-size: 28px;

                margin-bottom: 20px;

            }


            .btn {

                font-size: 18px;

                padding:
                    17px 12px;

                border-radius: 16px;

            }


            .btn small {

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         VÍDEO — METADE DA TELA
    ================================= -->

    <section class="video-area">


        <video

            id="bg-video"

            autoplay

            muted

            loop

            playsinline

            preload="auto">


            <source

                src="6e0435cdf73692771097c0abcf882e37.mp4"

                type="video/mp4">


            Seu navegador não suporta vídeo.


        </video>


        <div class="video-overlay"></div>


    </section>



    <!-- =================================
         BOTÕES
    ================================= -->

    <main class="content">


        <h1>

            🍕 Pizza Play

        </h1>


        <div class="buttons">


            <!-- TESTE GRÁTIS -->

            <a

                class="btn"

                href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a"

                target="_blank"

                rel="noopener noreferrer">


                🎁 CRIE SEU LOGIN E SENHA AQUI


                <small>

                    Aproveite 4 horas grátis

                </small>


            </a>



            <!-- PAINEL -->

            <a

                class="btn"

                href="https://clientefinal.com/"

                target="_blank"

                rel="noopener noreferrer">


                🔐 PAINEL DO CLIENTE


                <small>

                    Entrar com seu login e senha

                </small>


            </a>


        </div>


        <footer>

            🍕 Pizza Play © 2026

        </footer>


    </main>



    <!-- =================================
         SERVICE WORKER
    ================================= -->

    <script>


        if ("serviceWorker" in navigator) {


            window.addEventListener(

                "load",

                function () {


                    navigator.serviceWorker.register(

                        "./service-worker.js"

                    ).then(function () {


                        console.log(
                            "Service Worker ativo."
                        );


                    }).catch(function (erro) {


                        console.log(
                            "Erro:",
                            erro
                        );


                    });


                }

            );

        }


        /* =================================
           EFEITO DOS BOTÕES
        ================================= */

        document
            .querySelectorAll(".btn")
            .forEach(function (botao) {


                botao.addEventListener(
                    "click",
                    function () {


                        this.style.transform =
                            "scale(.97)";


                        setTimeout(
                            () => {

                                this.style.transform =
                                    "";

                            },
                            150
                        );


                    }
                );


            });


    </script>


</body>

</html>
