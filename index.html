
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Cliente</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* Vídeo de fundo */
#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Camada escura */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

/* Conteúdo */
.container{
    width:100%;
    max-width:420px;
    padding:30px;
    text-align:center;
}

/* Título */
h1{
    color:#fff;
    font-size:42px;
    font-weight:700;
    margin-bottom:45px;
    text-shadow:0 4px 15px rgba(0,0,0,.6);
}

/* Botão */
.btn{
    display:block;
    width:100%;
    text-decoration:none;
    color:#fff;
    background:rgba(220,20,60,.90);
    padding:18px;
    font-size:22px;
    font-weight:bold;
    border-radius:18px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 10px 35px rgba(0,0,0,.45);
    transition:.3s;
}

.btn:hover{
    background:rgba(255,0,0,.95);
    transform:scale(1.03);
}
</style>

</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="6e0435cdf73692771097c0abcf882e37.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

    <h1>Portal do Cliente</h1>

    <a class="btn" href="https://clientefinal.com/" target="_blank">
        🔐 Painel Cliente
    </a>

</div>

</body>
</html>
