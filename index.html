<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Cliente</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#ff7b00,#ff003c);
    padding:20px;
}

.card{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    width:110px;
    display:block;
    margin:0 auto 20px;
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:#ff7b00;
}

.login{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(45deg,#ff8800,#ff5e00);
}

.login:hover{
    opacity:.95;
}

.teste{
    display:block;
    text-align:center;
    text-decoration:none;
    margin-top:18px;
    padding:16px;
    border-radius:10px;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(45deg,#00b84f,#00e676);
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="logo" alt="Logo">

<h2>Bem-vindo(a)</h2>

<p>Faça login para continuar</p>

<form action="#" method="post">

<input
type="text"
class="input"
placeholder="Digite seu Login"
required>

<input
type="password"
class="input"
placeholder="Digite sua Senha"
required>

<button type="submit" class="login">
🔐 ENTRAR
</button>

</form>

<a
class="teste"
href="https://testeagora.tv/c4430a597cd6e4cbd4b65725aa31014a"
target="_blank">
🎁 CRIE SEU TESTE GRÁTIS POR 4 HORAS
</a>

<div class="footer">
Painel do Cliente © 2026
</div>

</div>

</body>
</html>
