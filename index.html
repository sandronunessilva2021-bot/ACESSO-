    <style>

<body>

<div class="container">

    <div class="card">

        <div class="icon">🎁</div>

        <h1>Teste Grátis por 4 Horas</h1>

        <p class="subtitle">
            Preencha seus dados abaixo para criar seu acesso de teste.
        </p>

        <form id="trialForm">

            <!-- NOME -->
            <div class="field">
                <label for="name">Nome</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Digite seu nome"
                    required>
            </div>

            <!-- LOGIN -->
            <div class="field">
                <label for="username">Login</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Escolha seu login"
                    required
                    minlength="3">
            </div>

            <!-- SENHA -->
            <div class="field">
                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Crie uma senha"
                    required
                    minlength="4">
            </div>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@exemplo.com">
            </div>

            <!-- WHATSAPP -->
            <div class="field">
                <label for="whatsapp">WhatsApp</label>

                <input
                    type="tel"
                    id="whatsapp"
                    placeholder="5511999999999">
            </div>

            <!-- BOUQUET -->
            <div class="field">
                <label for="idbouquet">ID do Bouquet</label>

                <input
                    type="number"
                    id="idbouquet"
                    placeholder="Ex: 1"
                    required
                    min="1">
            </div>

            <div class="bouquet-info">
                Informe o ID do pacote/bouquet que deverá ser liberado
                no teste.
            </div>

            <button
                type="submit"
                class="btn"
                id="submitBtn">

                🎁 CRIAR TESTE GRÁTIS

            </button>

        </form>

        <div id="result" class="result"></div>

        <a
            href="https://clientefinal.com/"
            class="back">

            ← Voltar para o login

        </a>

        <div class="footer">
            Teste gratuito • Acesso temporário
        </div>

    </div>

</div>


<script>

    /*
     * CONFIGURAÇÃO DA API
     *
     * O servidor da API é:
     * https://api.painelcliente.com
     *
     * Endpoint:
     * /trial_create/{token}
     */

    const API_URL =
        "https://api.painelcliente.com/trial_create/PANELCLIENT_UUNN4-CLUBY-84RO1-9ZKZ5";

    /*
     * SECRET DA API
     *
     * ATENÇÃO:
     * Em uma página pública esta informação ficará visível
     * para quem visualizar o código-fonte.
     *
     * Para produção, mova esta chamada para um backend.
     */

    const API_SECRET =
        "c238ce7e0774e91b2a3a2a4fa86a0784";


    const form =
        document.getElementById("trialForm");

    const button =
        document.getElementById("submitBtn");

    const result =
        document.getElementById("result");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        result.className = "result";
        result.innerHTML = "";

        button.disabled = true;
        button.innerHTML = "⏳ CRIANDO TESTE...";


        const name =
            document.getElementById("name").value.trim();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const email =
            document.getElementById("email").value.trim();

        const whatsapp =
            document.getElementById("whatsapp").value.trim();

        const idbouquet =
            Number(
                document.getElementById("idbouquet").value
            );


        /*
         * Validação básica
         */

        if (!name || !username || !password || !idbouquet) {

            showError(
                "Preencha todos os campos obrigatórios."
            );

            resetButton();

            return;
        }


        /*
         * Dados enviados para a API
         */

        const data = {

            secret: API_SECRET,

            username: username,

            password: password,

            idbouquet: [idbouquet],

            email: email,

            whatsapp: whatsapp,

            notes:
                "Teste grátis criado pelo formulário do site. Nome: "
                + name
        };


        try {

            const response =
                await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify(data)

                });


            let responseData;

            try {

                responseData =
                    await response.json();

            } catch {

                responseData = null;

            }


            /*
             * Verifica resposta HTTP
             */

            if (!response.ok) {

                let mensagem =
                    "A API recusou a criação do teste.";

                if (responseData) {

                    mensagem +=
                        "\n\nResposta da API:\n" +
                        JSON.stringify(
                            responseData,
                            null,
                            2
                        );
                }

                showError(mensagem);

                resetButton();

                return;
            }


            /*
             * Sucesso
             */

            result.className =
                "result success";

            result.innerHTML =
                "✅ TESTE CRIADO COM SUCESSO!\n\n" +
                "Login: " + username +
                "\nSenha: " + password +
                "\n\n" +
                "Seu teste foi enviado para o sistema.";


            /*
             * Mostra também a resposta da API
             * no console para diagnóstico.
             */

            console.log(
                "Resposta da API:",
                responseData
            );


            button.innerHTML =
                "✅ TESTE CRIADO";


        } catch (error) {

            console.error(error);

            showError(
                "Não foi possível conectar à API.\n\n" +
                "Se o código estiver correto, verifique " +
                "se a API permite requisições diretamente " +
                "do navegador (CORS)."
            );

            resetButton();

        }

    });


    function showError(message) {

        result.className =
            "result error";

        result.textContent =
            "❌ ERRO\n\n" + message;

    }


    function resetButton() {

        button.disabled = false;

        button.innerHTML =
            "🎁 CRIAR TESTE GRÁTIS";

    }

</script>

</body>
</html>
